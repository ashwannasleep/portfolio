<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clean modern background with nice colors -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Chat bubble shadow -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- AI response gradient -->
    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGradient)" rx="24"/>
  <rect width="300" height="300" fill="url(#accentGradient)" rx="24"/>
  
  <!-- Main chat window -->
  <rect x="40" y="50" width="220" height="200" rx="16" fill="white" filter="url(#softShadow)"/>
  
  <!-- Chat messages showing async/error handling concepts -->
  
  <!-- User message 1 -->
  <rect x="60" y="70" width="100" height="28" rx="14" fill="#f1f5f9"/>
  <text x="110" y="88" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" 
        font-size="12" font-weight="500" fill="#1e293b">Send request</text>
  
  <!-- Loading state indicator -->
  <rect x="180" y="75" width="60" height="18" rx="9" fill="#e0e7ff" opacity="0.8"/>
  <circle cx="195" cy="84" r="2.5" fill="#3b82f6" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="205" cy="84" r="2.5" fill="#3b82f6" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="215" cy="84" r="2.5" fill="#3b82f6" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  
  <!-- AI response -->
  <rect x="140" y="110" width="100" height="32" rx="16" fill="url(#aiBubble)"/>
  <text x="190" y="130" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" 
        font-size="11" font-weight="500" fill="white">Response</text>
  
  <!-- Error state example -->
  <rect x="60" y="155" width="120" height="28" rx="14" fill="#fee2e2"/>
  <text x="120" y="173" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" 
        font-size="11" font-weight="500" fill="#991b1b">Error occurred</text>
  
  <!-- Retry button -->
  <rect x="190" y="160" width="50" height="18" rx="9" fill="#f1f5f9" stroke="#3b82f6" stroke-width="1"/>
  <text x="215" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" 
        font-size="10" font-weight="600" fill="#3b82f6">Retry</text>
  
  <!-- Success state -->
  <rect x="140" y="195" width="100" height="28" rx="14" fill="#dcfce7"/>
  <text x="190" y="213" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" 
        font-size="11" font-weight="500" fill="#166534">Success!</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="80" r="2.5" fill="#3b82f6" opacity="0.2"/>
  <circle cx="270" cy="100" r="2" fill="#3b82f6" opacity="0.15"/>
  <circle cx="30" cy="220" r="2" fill="#3b82f6" opacity="0.2"/>
  <circle cx="270" cy="240" r="2.5" fill="#3b82f6" opacity="0.15"/>
</svg>
