<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Chat Demo cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.26"/>
      <stop offset="52%" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-opacity="0.24" stroke-width="1"/>
    </pattern>
    <filter id="orangeSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <style>
      .meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; font-size: 10px; letter-spacing: 3px; font-weight: 600; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; font-size: 8px; letter-spacing: 1.8px; }
      .headline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 56px; letter-spacing: 1px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; font-size: 12px; letter-spacing: 6px; font-weight: 600; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f97316; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; font-size: 11px; letter-spacing: 1.6px; font-weight: 700; }
      .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; font-size: 12px; letter-spacing: 0.5px; font-weight: 500; }
    </style>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#coreGlow)"/>
  <rect width="600" height="600" fill="url(#grid)" opacity="0.8"/>

  <line x1="300" y1="0" x2="300" y2="600" stroke="#1e293b" stroke-opacity="0.3"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#1e293b" stroke-opacity="0.3"/>

  <path d="M16 10h16M10 10v16" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M584 10h-16M590 10v16" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 590h16M10 590v-16" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M584 590h-16M590 590v-16" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <text x="24" y="28" class="meta">UX CASE STUDY / 001</text>
  <line x1="24" y1="35" x2="48" y2="35" stroke="#f97316" stroke-width="1.5"/>

  <text x="516" y="28" class="meta">V 2.4.0</text>
  <rect x="483" y="34" width="95" height="21" rx="4" fill="#130e0b" stroke="#f97316" stroke-opacity="0.55"/>
  <circle cx="493" cy="44.5" r="2" fill="#f97316"/>
  <text x="501" y="48.5" class="badge">STABLE BUILD</text>

  <circle cx="300" cy="250" r="66" fill="#f97316" fill-opacity="0.24" filter="url(#orangeSoft)"/>
  <rect x="235" y="165" width="130" height="130" rx="16" fill="#121417" fill-opacity="0.72" stroke="#f97316" stroke-opacity="0.48" stroke-width="1.5"/>

  <rect x="280" y="212" width="40" height="32" rx="5" fill="#f97316"/>
  <path d="M280 244 L280 252 L288 244 Z" fill="#f97316"/>
  <circle cx="341" cy="187" r="3" fill="#f97316"/>

  <rect x="223" y="169" width="28" height="28" rx="6" fill="#14161a" stroke="#334155" stroke-opacity="0.55"/>
  <path d="M232 187h10l-3-3m3 3l-3 3" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="289" y="302" width="74" height="20" rx="5" fill="#17181d" stroke="#334155" stroke-opacity="0.52"/>
  <text x="296" y="315" class="tiny">LATENCY:</text>
  <text x="334" y="315" class="value" style="font-size:10px;">14ms</text>

  <text x="300" y="385" class="headline" text-anchor="middle">
    <tspan fill="#f8fafc">AI CHAT </tspan>
    <tspan fill="#f97316">DEMO</tspan>
  </text>

  <line x1="157" y1="412" x2="222" y2="412" stroke="#1d4ed8" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="380" y1="412" x2="446" y2="412" stroke="#1d4ed8" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="229" y="419" class="sub">DESIGNER / ENGINEER</text>

  <text x="24" y="545" class="label">STATUS</text>
  <text x="24" y="567" class="value">ENCRYPTED  //  AES-256</text>
  <line x1="123" y1="538" x2="123" y2="571" stroke="#334155" stroke-width="1.5"/>

  <text x="136" y="545" class="label">NETWORK</text>
  <text x="136" y="567" class="value">TCP  /  IP</text>

  <text x="468" y="548" class="meta" style="font-size:11px; letter-spacing:2px;">PORTFOLIO CORE</text>
  <text x="468" y="566" class="tiny">(c) 2024 PRECISION SYSTEMS</text>
</svg>
